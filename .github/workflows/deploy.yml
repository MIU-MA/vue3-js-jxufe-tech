name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    if: github.repository == 'jxufe-tech/jxufe-tech-web'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      #    阶段一：构建 + 校验（全部从仓库根目录执行）
      #    任何一项失败即停止上线，不部署
      # ==========================================
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build (frontend SSG + backend)
        run: npm run build
        env:
          # SSG 构建时从线上 API 抓取 CMS 文章，展开 /news/:id 静态页
          VITE_SSG_API_BASE: https://www.jxufe-tech.top

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Frontend typecheck (vue-tsc)
        run: npx vue-tsc --noEmit -p frontend/tsconfig.json

      - name: Backend lint (eslint, no --fix)
        run: cd backend && npx eslint "{src,test}/**/*.ts"

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      # 用全新空库跑完整迁移，再以生产模式启动编译产物做健康检查，
      # 确保 production 依赖的 migration（users/articles/ai_usage）在干净库上可完整执行
      - name: Verify migrations on empty DB + app health
        env:
          NODE_ENV: production
          DB_PATH: /tmp/jxufe-ci.db
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          ADMIN_USERNAME: ciadmin
          ADMIN_PASSWORD: ci-test-password
          CHAT_TOKEN_SECRET: ci-only-chat-secret-0123456789abcdef
        run: |
          rm -f "$DB_PATH"
          npm run migration:run
          cd backend
          (node dist/main.js > /tmp/jxufe-ci.log 2>&1 & echo $! > /tmp/jxufe-ci.pid)
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3003/api/health | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "✅ 空库迁移 + 启动健康检查通过"
              kill "$(cat /tmp/jxufe-ci.pid)"
              exit 0
            fi
            sleep 1
          done
          echo "❌ 启动健康检查失败"
          cat /tmp/jxufe-ci.log
          kill "$(cat /tmp/jxufe-ci.pid)" 2>/dev/null || true
          exit 1

      # ==========================================
      #   阶段二：部署产物
      # ==========================================
      - name: Deploy Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech/frontend
          source: "frontend/dist/**"
          strip_components: 2
          overwrite: true

      - name: Deploy Backend Dist to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech/backend
          source: "backend/dist/**"
          strip_components: 1
          overwrite: true

      - name: Deploy Manifests & PM2 Config to Root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech
          source: "package.json,package-lock.json,ecosystem.config.js"
          overwrite: true

      # ==========================================
      #   阶段三：服务器安装依赖并重启
      #   注意：不再从 Git 仓库复制 backend/.env。
      #   .env 由服务器单独维护（或密钥注入），部署前须已存在。
      # ==========================================
      - name: Install deps and restart backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /www/wwwroot/jxufe-tech
            # 确保静态资源目录存在
            mkdir -p backend/public/uploads
            # 从根目录统一安装生产依赖（backend/dist 会向上解析到根 node_modules）
            npm ci --omit=dev
            # 统一用根 ecosystem.config.js 启动/重载（startOrReload：未启动则启动，已启动则热重载）
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save

      - name: Verify SSE & API connectivity
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "========== 检查 .env 是否已由服务器维护 =========="
            if [ -f /www/wwwroot/jxufe-tech/backend/.env ]; then
              echo "✅ .env 已存在（服务器维护，不随仓库部署）"
            else
              echo "❌ .env 缺失！请手动创建: echo 'DEEPSEEK_API_KEY=sk-xxx' >> /www/wwwroot/jxufe-tech/backend/.env"
            fi

            echo "========== 检查后端进程 =========="
            pm2 list | grep jxufe-backend || { echo "❌ PM2 进程未启动"; exit 1; }

            echo "========== 后端健康检查（真实请求接口，证明新代码生效）=========="
            if curl -fsS http://127.0.0.1:3003/api/health | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "✅ /api/health 返回 status=ok"
            else
              echo "❌ /api/health 检查失败，新版后端未生效"
              pm2 logs jxufe-backend --lines 30 --nostream 2>/dev/null || true
              exit 1
            fi

            echo "========== 检查 Nginx SSE 配置 =========="
            NGINX_CONF=$(grep -rl "proxy_pass.*3003\|proxy_pass.*jxufe" /etc/nginx /www/server 2>/dev/null | head -1)
            if [ -n "$NGINX_CONF" ]; then
              echo "找到 Nginx 配置: $NGINX_CONF"
              if grep -q "proxy_buffering[[:space:]]*off" "$NGINX_CONF" 2>/dev/null; then
                echo "✅ SSE 流已配置 (proxy_buffering off)"
              else
                echo "⚠️  未配置 proxy_buffering off，SSE 流可能被 Nginx 缓冲"
                echo "   请在 location /api/ 块中添加: proxy_buffering off; proxy_cache off;"
              fi
              if grep -q "try_files" "$NGINX_CONF" 2>/dev/null; then
                echo "✅ SSG 回退已配置 (try_files ... /index.html)"
              else
                echo "⚠️  未配置 try_files，/news/:id 等预渲染路由会回退首页"
                echo "   请在 location / 块中添加: try_files \$uri \$uri.html \$uri/ /index.html;"
              fi
            else
              echo "未自动找到 Nginx 配置，请手动确认 location /api/ 的 proxy_buffering off 与 location / 的 try_files"
            fi
