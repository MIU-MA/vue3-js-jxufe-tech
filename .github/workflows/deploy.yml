name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    if: github.repository == 'jxufe-tech/jxufe-tech-web'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 🎯 阶段一：构建 + 校验（全部从仓库根目录执行）
      #    任何一项失败即停止上线，不部署
      # ==========================================
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build (frontend SSG + backend)
        run: npm run build
        env:
          # SSG 构建时从线上 API 抓取 CMS 文章，展开 /news/:id 静态页
          VITE_SSG_API_BASE: https://api.jxufe-tech.top

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Frontend typecheck (vue-tsc)
        run: npx vue-tsc --noEmit -p frontend/tsconfig.json

      - name: Backend lint (eslint, no --fix)
        run: cd backend && npx eslint "{src,test}/**/*.ts"

      # ==========================================
      # 🎯 阶段二：部署产物
      # ==========================================
      - name: Deploy Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech/frontend
          source: "frontend/dist/**"
          strip_components: 2
          overwrite: true

      - name: Deploy Backend Dist to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech/backend
          source: "backend/dist/**"
          strip_components: 2
          overwrite: true

      # 根目录的 package.json / package-lock.json 是唯一依赖清单，
      # 部署到仓库根，供服务器在根目录执行 npm ci --omit=dev
      - name: Deploy Manifests & PM2 Config to Root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech
          source: "package.json,package-lock.json,ecosystem.config.js"
          overwrite: true

      # ==========================================
      # 🎯 阶段三：服务器安装依赖并重启
      #   注意：不再从 Git 仓库复制 backend/.env。
      #   .env 由服务器单独维护（或密钥注入），部署前须已存在。
      # ==========================================
      - name: Install deps and restart backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /www/wwwroot/jxufe-tech
            # 确保静态资源目录存在
            mkdir -p backend/public/uploads
            # 从根目录统一安装生产依赖（backend/dist 会向上解析到根 node_modules）
            npm ci --omit=dev
            # 用 PM2 启动或重启进程（ecosystem 内 cwd 指向 backend）
            pm2 restart backend/ecosystem.config.js || pm2 start backend/ecosystem.config.js
            pm2 save

      - name: Verify SSE & API connectivity
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "========== 检查 .env 是否已由服务器维护 =========="
            if [ -f /www/wwwroot/jxufe-tech/backend/.env ]; then
              echo "✅ .env 已存在（服务器维护，不随仓库部署）"
            else
              echo "❌ .env 缺失！请手动创建: echo 'DEEPSEEK_API_KEY=sk-xxx' >> /www/wwwroot/jxufe-tech/backend/.env"
            fi

            echo "========== 检查后端进程 =========="
            pm2 list | grep jxufe-backend || echo "❌ PM2 进程未启动"

            echo "========== 检查 Nginx SSE 配置 =========="
            NGINX_CONF=$(grep -rl "proxy_pass.*3003\|proxy_pass.*jxufe" /etc/nginx /www/server 2>/dev/null | head -1)
            if [ -n "$NGINX_CONF" ]; then
              echo "找到 Nginx 配置: $NGINX_CONF"
              if grep -q "proxy_buffering[[:space:]]*off" "$NGINX_CONF" 2>/dev/null; then
                echo "✅ SSE 流已配置 (proxy_buffering off)"
              else
                echo "⚠️  未配置 proxy_buffering off，SSE 流可能被 Nginx 缓冲"
                echo "   请在 location /api/ 块中添加: proxy_buffering off; proxy_cache off;"
              fi
            else
              echo "未自动找到 Nginx 配置，请手动确认 location /api/ 是否设置了 proxy_buffering off;"
            fi
