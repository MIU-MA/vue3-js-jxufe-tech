name: Rebuild Frontend (SSG)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（如 CMS 文章更新）'
        required: false
        default: 'manual'

jobs:
  rebuild-frontend:
    if: github.repository == 'jxufe-tech/jxufe-tech-web'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 重新抓取 CMS 文章并预渲染（SSG），再重新部署前端静态文件
      - name: Build frontend (SSG)
        run: npm run build:frontend
        env:
          VITE_SSG_API_BASE: https://api.jxufe-tech.top

      - name: Deploy Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech/frontend
          source: "frontend/dist/**"
          strip_components: 2
          overwrite: true
