name: Rebuild Frontend (SSG)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因（如 CMS 文章更新）'
        required: false
        default: 'manual'

jobs:
  rebuild-frontend:
    if: github.repository == 'jxufe-tech/jxufe-tech-web'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (SSG)
        run: npm run build:frontend
        env:
          VITE_SSG_API_BASE: https://www.jxufe-tech.top

      - name: Deploy Frontend to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          target: /www/wwwroot/jxufe-tech/frontend
          source: "frontend/dist/**"
          strip_components: 2
          overwrite: true

      - name: Prune stale frontend assets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /www/wwwroot/jxufe-tech/frontend/assets
            echo "清理 30 分钟前的旧 assets（本次刚上传的不在列）"
            find . -maxdepth 1 -type f -mmin +30 -print -delete
